name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax gate (whole package)
        run: python -m compileall -q blinkwatch power training tests
      - name: UI contract tests (dependency-free)
        run: |
          python -m unittest -v \
            tests.test_liquid_glass \
            tests.test_power_ui \
            tests.test_glass_contrast
