x-common: &common
  build: .
  image: blinkwatch
  restart: unless-stopped
  user: "1000:1000"
  env_file: .env
  environment:
    DATA_DIR: /data
    DOWNLOAD_PATH: /home/giacomo/Documenti/Recordings
    NTFY_URL: http://ntfy
    # 2026-10-27: human_20261026 (CLIP-L fine-tuned on 949 hand labels). Same-validation A/B: 76.7% vs 69.8% bacc with the 17/10 labels only.
    # Threshold 0.6: out-of-fold precision 94.0% (group) / 77.1% (time) at 63%/20% coverage; 0.5 would be 91.5%/67.0%.
    # To roll back: PERSON_MODEL -> /data/models/persona_clipL_v3.pt and IDENTITY_MIN_CONF_PERSONA -> "0.35".
    PERSON_MODEL: /data/models/persona_clipL_human_20261026.pt
    IDENTITY_MIN_CONF_PERSONA: "0.6"
  volumes:
    - ./data:/data
    - /home/giacomo/Documenti/Recordings:/home/giacomo/Documenti/Recordings

services:
  watcher:
    <<: *common
    command: python -m blinkwatch.watcher

  # Phone used as an IP camera (see blinkwatch/ipcam.py); needs IPCAM_* in .env. Clips go through the watcher like Blink clips.
  ipcam:
    <<: *common
    command: python -m blinkwatch.ipcam

  web:
    <<: *common
    command: uvicorn blinkwatch.web:app --host 0.0.0.0 --port 8765
    ports:
      - "8765:8765"

  ntfy:
    image: binwiederhier/ntfy
    command: serve
    restart: unless-stopped
    user: "1000:1000"
    environment:
      NTFY_BASE_URL: http://100.66.9.116:8088
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
    volumes:
      - ./data/ntfy:/var/cache/ntfy
    ports:
      - "8088:80"
