x-common: &common
  build: .
  image: blinkwatch
  restart: unless-stopped
  user: "1000:1000"
  env_file: .env
  environment:
    DATA_DIR: /data
    DOWNLOAD_PATH: /home/giacomo/Documenti/Recordings
    NTFY_URL: http://ntfy
    # v3 is less confident than v1 on real clips (at 0.5 it named 15/80 recent crops, v1 26/80). Threshold 0.35: held-out precision 95.1%/93.0%
    # (time/group folds), same as v1 at 0.5. To roll back: delete these two lines (defaults: v1 at 0.5).
    PERSON_MODEL: /data/models/persona_clipL_v3.pt
    IDENTITY_MIN_CONF_PERSONA: "0.35"
  volumes:
    - ./data:/data
    - /home/giacomo/Documenti/Recordings:/home/giacomo/Documenti/Recordings

services:
  watcher:
    <<: *common
    command: python -m blinkwatch.watcher

  web:
    <<: *common
    command: uvicorn blinkwatch.web:app --host 0.0.0.0 --port 8765
    ports:
      - "8765:8765"

  ntfy:
    image: binwiederhier/ntfy
    command: serve
    restart: unless-stopped
    user: "1000:1000"
    environment:
      NTFY_BASE_URL: http://100.66.9.116:8088
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
    volumes:
      - ./data/ntfy:/var/cache/ntfy
    ports:
      - "8088:80"
