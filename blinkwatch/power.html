<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consumi</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --text:#e8eaf0; --muted:#8b92a3; --line:#262a34; --accent:#7c8cff; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f5f8; --card:#fff; --text:#1a1d24; --muted:#697085; --line:#e1e4ec; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,sans-serif; }
  header { padding:12px 16px; display:flex; gap:12px; align-items:center; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header a { color:var(--accent); text-decoration:none; } h1 { font-size:18px; margin:0; flex:1; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .total { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .total b { font-size:30px; } .muted { color:var(--muted); font-size:13px; }
  .host { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .host h2 { font-size:16px; margin:0 0 6px; display:flex; justify-content:space-between; }
  .row { display:flex; justify-content:space-between; font-size:14px; padding:2px 0; }
  input, select { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font:inherit; width:90px; }
  .warn { color:#d69e2e; }
</style>
</head>
<body>
<header><h1>Consumi dei PC</h1><label class="muted">€/kWh <input id="price" type="number" step="0.01" value="0.28"></label>
  <select id="month"></select><a href="/">← Eventi</a></header>
<main>
  <div class="total"><div class="muted">Totale stimato del mese (tutti i PC)</div><b id="kwh">–</b> kWh <span id="cost" class="muted"></span>
    <div class="muted" style="margin-top:6px">Stima: CPU e GPU sono misurate; scheda madre, dischi, ventole e perdite dell'alimentatore sono una stima regolabile per ogni PC.</div></div>
  <div id="hosts"></div>
</main>
<script>
const $ = id => document.getElementById(id);
let data = null;
try { const p = localStorage.getItem("kwhPrice"); if (p) $("price").value = p; } catch (e) {}
const now = new Date();
for (let i = 0; i < 6; i++) {
  const d = new Date(now.getFullYear(), now.getMonth() - i, 1), v = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  $("month").add(new Option(d.toLocaleString("it-IT", { month: "long", year: "numeric" }), v));
}
function render() {
  if (!data) return;
  const price = parseFloat($("price").value) || 0;
  try { localStorage.setItem("kwhPrice", $("price").value); } catch (e) {}
  const kwh = v => (v < 10 ? v.toFixed(2) : v.toFixed(1));  // small totals must not collapse to "0.0"
  const liveRow = h => {
    const l = h.live;
    if (!l || l.age_s > 300) return `<div class="row"><span>Adesso</span><span class="muted">nessun dato recente${l ? " (" + Math.round(l.age_s / 60) + " min fa)" : ""}</span></div>`;
    const parts = l.sys_w != null ? [`sistema ${l.sys_w} W`] : [l.cpu_w != null ? `CPU ${l.cpu_w} W` : null, l.gpu_w != null ? `GPU ${l.gpu_w} W` : null].filter(Boolean);
    return `<div class="row"><span><b>Adesso</b></span><span><b>${l.wall_w ?? "–"} W</b> <span class="muted">alla presa (${parts.join(" · ")})</span></span></div>`;
  };
  $("kwh").textContent = kwh(data.total_kwh);
  $("cost").textContent = price ? "≈ " + (data.total_kwh * price).toFixed(2) + " €" : "";
  $("hosts").innerHTML = data.hosts.map(h => `<div class="host"><h2><span></span><span>${kwh(h.kwh)} kWh</span></h2>
    ${liveRow(h)}
    <div class="row"><span>Potenza media</span><span>${h.avg_w ?? "–"} W</span></div>
    <div class="row"><span>Ore registrate</span><span>${h.hours_reporting} h</span></div>
    <div class="row"><span>Di cui CPU / GPU misurati</span><span>${kwh(h.kwh_cpu)} / ${kwh(h.kwh_gpu)} kWh</span></div>
    <div class="row"><span>Resto del PC (stima) · alimentatore</span><span>${h.base_w} W · ${Math.round(h.eff * 100)}%</span></div>
    ${h.with_cpu_counter < h.samples ? `<div class="warn muted">${h.samples - h.with_cpu_counter} rilevazioni senza contatore CPU non sono contate.</div>` : ""}
    <div class="muted">Ultima rilevazione: ${h.last_seen ? new Date(h.last_seen).toLocaleString("it-IT") : "mai"}</div></div>`).join("")
    || '<div class="muted">Ancora nessun dato: installa il registratore (power/install.sh) su un PC.</div>';
  document.querySelectorAll(".host h2 span:first-child").forEach((el, i) => el.textContent = data.hosts[i].host);
}
async function load() { data = await (await fetch("/api/power/monthly?month=" + $("month").value)).json(); render(); }
$("month").onchange = load; $("price").oninput = render; load(); setInterval(load, 60000);
</script>
</body>
</html>
