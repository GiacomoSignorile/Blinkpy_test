<title>Blinkwatch · Etichettatura</title>
<style>
  :root { color-scheme:light; --bg:#eef3f7; --surface:#fff; --surface2:#f5f8fb; --ink:#16222b; --muted:#6d7f8b; --line:#e1e9ef; --accent:#6d28d9; --accent-soft:#f1eafe; --good:#2fa874; --warn:#e8913c; --shadow:0 10px 30px rgba(30,60,90,.08); }
  @media(prefers-color-scheme:dark) { :root { color-scheme:dark; --bg:#0d1318; --surface:#161e25; --surface2:#1c262f; --ink:#e8eef2; --muted:#8b9ba6; --line:#26323c; --accent:#c4b5fd; --accent-soft:#302044; --good:#43d196; --warn:#f3a65a; --shadow:0 10px 30px rgba(0,0,0,.35); } }
  * { box-sizing:border-box; }
  body { margin:0; min-width:320px; color:var(--ink); background:var(--bg); font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  button,select { font:inherit; color:inherit; } button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  header { max-width:1120px; margin:auto; padding:20px 18px 10px; display:flex; gap:12px; align-items:center; }
  header a { color:var(--accent); text-decoration:none; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 14px; }
  h1 { font-size:26px; margin:0; flex:1; letter-spacing: 0; }
  #stats { max-width:1120px; margin:auto; padding:8px 18px 14px; display:flex; flex-wrap:wrap; gap:8px; font-size:13px; color:var(--muted); }
  #stats span { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:8px 12px; box-shadow:var(--shadow); }
  #stats b { color:var(--ink); }
  main { max-width:760px; margin:0 auto; padding:8px 18px 34px; }
  .box { background:var(--surface); border:1px solid var(--line); border-radius:22px; overflow:hidden; box-shadow:var(--shadow); }
  #img { width:100%; height:min(58vh,560px); object-fit:contain; background:#080b0e; display:block; }
  .info { padding:10px 14px; font-size:13px; color:var(--muted); display:flex; justify-content:space-between; gap:12px; }
  .btns { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:12px; }
  button { padding:14px 10px; border-radius:14px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:650; transition:transform .12s,background .12s; }
  button:active { transform:scale(.98); background:var(--accent-soft); }
  button.sec { font-weight:500; color:var(--muted); padding:12px 10px; }
  #empty { text-align:center; color:var(--muted); padding:48px 0; background:var(--surface); border:1px solid var(--line); border-radius:20px; }
  .tabs,.mode { max-width:1120px; margin:auto; display:flex; gap:8px; padding:4px 18px 10px; overflow-x:auto; }
  .tabs button,.mode button { flex:0 0 auto; padding:8px 16px; border-radius:999px; }
  .tabs button.active,.mode button.active,#rfilter button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.suggested { border:2px solid var(--accent); background:var(--accent-soft); }
  #sugg { padding:10px 12px; font-size:14px; color:var(--muted); min-height:42px; }
  #sugg b { color:var(--accent); } #sugg .warn { color:var(--warn); }
  #review { max-width:1120px; margin:auto; padding:0 18px 36px; } #review[hidden] { display:none; }
  #rfilter { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  #rfilter button { padding:8px 12px; border-radius:999px; background:var(--surface); font-weight:550; }
  #rgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
  .rc { background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:var(--shadow); }
  .rc img { width:100%; height:190px; object-fit:contain; background:#080b0e; display:block; }
  .rcinfo { color:var(--muted); font-size:12px; padding:8px 10px 0; }
  .rc select { width:calc(100% - 16px); margin:8px; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--surface2); color:var(--ink); }
  kbd { opacity:.65; font-weight:400; font-size:12px; }
  [hidden] { display:none !important; }
  @media(max-width:520px) { header { padding-top:14px; } h1 { font-size:22px; } .info { flex-direction:column; gap:2px; } #rgrid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; } .rc img { height:145px; } }
  /* Shared Blinkwatch shell, navigation, theme and card language. */
  :root[data-theme="dark"] { color-scheme:dark; --bg:#0d1318; --surface:#161e25; --surface2:#1c262f; --ink:#e8eef2; --muted:#8b9ba6; --line:#26323c; --accent:#c4b5fd; --accent-soft:#302044; --good:#43d196; --warn:#f3a65a; --shadow:0 10px 30px rgba(0,0,0,.35); }
  :root[data-theme="light"] { color-scheme:light; --bg:#eef3f7; --surface:#fff; --surface2:#f5f8fb; --ink:#16222b; --muted:#6d7f8b; --line:#e1e9ef; --accent:#6d28d9; --accent-soft:#f1eafe; --good:#2fa874; --warn:#e8913c; --shadow:0 10px 30px rgba(30,60,90,.08); }
  body { padding-bottom:calc(86px + env(safe-area-inset-bottom)); }
  .shell { width:min(100% - 28px,1120px); margin:0 auto; }
  .topbar { max-width:none; padding:18px 0 8px; justify-content:space-between; border:0; }
  .topbar h1 { font-size:26px; font-weight: 600; letter-spacing: 0; }
  .eyebrow { margin:0; font-size:12px; color:var(--muted); }
  .pill { display:inline-flex; align-items:center; justify-content:center; width:38px; min-height:38px; padding:0; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); }
  .pill svg { width:18px; height:18px; }
  .hero { margin:0 -14px; padding:12px 14px 18px; background:var(--surface); border-radius:0 0 32px 32px; }
  :root[data-theme="dark"] .hero { background:var(--surface); }
  .hero-copy { display:flex; flex-direction:column; gap:4px; margin:0 4px 12px; }
  .hero-copy strong { font-size:17px; }
  .hero-copy span { color:var(--muted); font-size:13px; }
  #stats { max-width:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fit,minmax(135px,1fr)); gap:8px; }
  #stats span { min-height:64px; display:flex; flex-direction:column; justify-content:center; background:color-mix(in srgb,var(--surface) 88%,transparent); border:1px solid var(--line); border-radius:18px; padding:8px 12px; box-shadow:var(--shadow); }
  #stats b { font-size:22px; line-height:1.15; }
  .controls { position:sticky; top:0; z-index:6; margin:8px -14px 0; padding:10px 14px; display:flex; flex-wrap:wrap; align-items:center; gap:8px; background:color-mix(in srgb,var(--bg) 92%,transparent);  border-bottom:1px solid var(--line); }
  .tabs,.mode { max-width:none; margin:0; padding:0; overflow:visible; }
  .tabs button,.mode button { min-height:36px; padding:0 12px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-size:13px; font-weight:550; }
  .tabs button.active,.mode button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .subject-filters { display:flex; gap:8px; overflow-x:auto; padding:12px 0 4px; scrollbar-width:none; }
  .subject-filters::-webkit-scrollbar { display:none; }
  .subject-chip { flex:none; min-height:35px; padding:0 12px; border-radius:999px; background:var(--surface); border:1px solid var(--line); color:var(--muted); font-size:13px; font-weight:550; }
  .subject-chip.active { background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
  main { max-width:760px; padding:14px 0 34px; }
  .box { border-radius:var(--radius,20px); }
  #sugg { padding:12px 4px; }
  #review { max-width:none; padding:14px 0 40px; }
  #rfilter button { color:var(--ink); }
  .bottom-nav { position:fixed; left:0; right:0; bottom:0; z-index:10; display:flex; justify-content:space-around; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); background:color-mix(in srgb,var(--surface) 92%,transparent);  border-top:1px solid var(--line); }
  .nav { flex:1; max-width:130px; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--muted); font-size:11px; padding:4px; text-decoration:none; }
  .nav svg { width:25px; height:25px; } .nav.active { color:var(--accent); }
  @media(max-width:560px) { .topbar h1 { font-size:24px; } .controls { gap:8px; } .tabs,.mode { flex:1 1 auto; } .tabs button,.mode button { flex:1; } }
</style>

</head>
<body class="page-label">
<div class="shell">
  <header class="topbar">
    <div><p class="eyebrow">Blinkwatch · apprendimento</p><h1>Etichettatura</h1></div>
    <button class="pill icon-btn" id="theme" type="button" aria-label="Cambia tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="theme-icon"></svg></button>
  </header>
  <section class="hero">
    <div class="hero-copy"><strong>Insegna al modello</strong><span>Conferma o correggi i soggetti riconosciuti nelle clip.</span></div>
    <div id="stats" class="stats"></div>
  </section>
  <div class="controls">
    <div class="tabs" id="tabs" role="group" aria-label="Tipo di soggetto"><button data-kind="animale" class="active">Animali</button><button data-kind="persona">Persone</button></div>
    <div class="mode" role="group" aria-label="Modalità di etichettatura"><button id="m-label" class="active">Da etichettare</button><button id="m-review">Rivedi etichettati</button></div>
  </div>
  <div id="subject-filters" class="subject-filters" aria-label="Filtra per soggetto"></div>
  <main>
    <div id="card" hidden>
      <div class="box"><img id="img" alt=""><div class="info"><span id="what"></span><span id="when"></span></div></div>
      <div id="sugg"></div>
      <div class="btns" id="btns"></div>
      <div class="btns"><button class="sec" id="skip">Salta</button><button class="sec" id="undo">Annulla</button></div>
    </div>
    <div id="empty" hidden>Niente da etichettare<br>Torna più tardi, nuovi ritagli arrivano con i movimenti.</div>
  </main>
  <section id="review" hidden><div id="rfilter"></div><div id="rgrid"></div></section>
</div>
<nav class="bottom-nav" aria-label="Navigazione principale">
  <a class="nav" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 4v5"/></svg><span>Eventi</span></a>
  <a class="nav" href="/cameras"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Telecamere</span></a>
  <a class="nav active" href="/label" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12 12 20 4 12V4h8z"/><circle cx="8.5" cy="8.5" r="1.3"/></svg><span>Etichetta</span></a>
  <a class="nav" href="/power"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"/></svg><span>Consumi</span></a>
</nav>

<script>
let kind = "animale", queue = [], labels = [], current = null, last = null, skipped = new Set(), activeSubject = "";
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
};
const THEMES = ["auto", "light", "dark"];
const THEME_ICON = {
  auto: '<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/>',
  light: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>',
  dark: '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>',
};
function applyTheme(t) {
  if (!THEMES.includes(t)) t = "auto";
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  $("theme-icon").innerHTML = THEME_ICON[t];
  const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector('meta[name="theme-color"]').content = dark ? "#141415" : "#fafafa";
}
$("theme").onclick = () => { const n = THEMES[(THEMES.indexOf(store.get("theme", "auto")) + 1) % 3]; store.set("theme", n); applyTheme(n); };
applyTheme(store.get("theme", "auto"));

document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  kind = b.dataset.kind; queue = []; skipped = new Set(); last = null; activeSubject = "";
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("active", x === b));
  $("btns").innerHTML = ""; refill().then(show);
});

function drawSubjectFilters(stats) {
  const root = $("subject-filters");
  root.innerHTML = "";
  const subjects = Object.keys(stats).filter(k => k.startsWith("review:")).map(k => k.slice(7));
  const counts = Object.fromEntries(Object.entries(stats).filter(([k]) => !k.startsWith("_") && !k.startsWith("auto:") && !k.startsWith("review:")));
  subjects.sort((a, b) => (counts[a] || 0) - (counts[b] || 0) || a.localeCompare(b));
  const add = (subject, text, count) => {
    const b = document.createElement("button");
    b.className = "subject-chip" + (activeSubject === subject ? " active" : "");
    b.textContent = count == null ? text : `${text} · ${count}`;
    b.setAttribute("aria-pressed", String(activeSubject === subject));
    b.onclick = () => {
      if (activeSubject === subject) return;
      activeSubject = subject; queue = []; skipped = new Set();
      drawSubjectFilters(stats);
      refill().then(show);
    };
    root.appendChild(b);
  };
  add("", "Tutti", stats._da_etichettare || 0);
  subjects.forEach(name => add(name, name, stats[`review:${name}`]));
  root.hidden = mode !== "label" || subjects.length === 0;
}

async function refill() {
  const params = new URLSearchParams({ kind, limit: "30" });
  if (activeSubject) params.set("label", `review:${activeSubject}`);
  const d = await (await fetch(`/api/crops?${params}`, { cache: "no-store" })).json();
  labels = d.labels;
  const have = new Set(queue.map(c => c.id));
  d.crops.filter(c => !skipped.has(c.id) && !have.has(c.id)).forEach(c => queue.push(c));
  const auto = Object.entries(d.stats).filter(([k]) => k.startsWith("auto:")).reduce((n, [, v]) => n + v, 0);
  const reviewCount = Object.entries(d.stats).filter(([k]) => k.startsWith("review:")).reduce((n, [, v]) => n + v, 0);
  $("stats").innerHTML = Object.entries(d.stats).filter(([k]) => !k.startsWith("auto:") && !k.startsWith("review:"))
    .map(([k, v]) => `<span>${k === "_da_etichettare" ? "da etichettare" : k}: <b>${v}</b></span>`).join("")
    + (reviewCount ? `<span>suggerite da verificare: <b>${reviewCount}</b></span>` : "")
    + (auto ? `<span>auto-etichettate: <b>${auto}</b></span>` : "");
  drawSubjectFilters(d.stats);
  if (!$("btns").children.length) {
    labels.forEach((l, i) => {
      const b = document.createElement("button");
      b.dataset.label = l;
      b.innerHTML = l === "altro" ? `Altro / non valido <kbd>${i + 1}</kbd>` : `${l} <kbd>${i + 1}</kbd>`;
      b.onclick = () => choose(l); $("btns").appendChild(b);
    });
  }
}

function show() {
  current = queue[0] || null;
  $("card").hidden = !current; $("empty").hidden = !!current;
  document.querySelectorAll("#btns button").forEach(b => b.classList.remove("suggested"));
  if (!current) return;
  $("img").src = "/crop/" + current.id;
  $("what").textContent = `YOLO: ${current.det_class} ${Math.round(current.conf * 100)}% · ${current.camera.trim()}`;
  $("when").textContent = new Date(current.created_at).toLocaleString("it-IT", { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" });
  const sg = current.suggestion;
  if (sg) {
    $("sugg").innerHTML = `Suggerito${sg.source === "auto" ? " dal modello grande" : ""}: <b>${sg.label}</b> · confidenza ${Math.round(sg.score * 100)}%` +
      (sg.n ? ` · ${sg.n} esempi` : "") +
      (sg.provisional ? ` <span class="warn">(provvisorio, pochi esempi)</span>` : "") + ` <kbd>Invio</kbd> per accettare`;
    document.querySelectorAll("#btns button").forEach(b => b.classList.toggle("suggested", b.dataset.label === sg.label));
  } else {
    $("sugg").textContent = "Nessun suggerimento (servono esempi di almeno 2 etichette diverse).";
  }
}

async function choose(label) {
  if (!current) return;
  const c = current; queue.shift();
  const response = await fetch(`/api/crops/${c.id}/label`, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ label }) });
  if (!response.ok) { queue.unshift(c); show(); $("sugg").textContent = "Salvataggio non riuscito: riprova."; return; }
  last = c;
  // Keep the prefetched batch: avoid a model refit and HTTP round-trip per label.
  show();
  if (queue.length < 5) refill().then(show);
}

$("skip").onclick = () => { if (current) { skipped.add(current.id); queue.shift(); show(); if (queue.length < 5) refill().then(show); } };
$("undo").onclick = async () => {
  if (!last) return;
  await fetch(`/api/crops/${last.id}/label`, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ label: null }) });
  last = null; queue = []; await refill(); show();
};
document.onkeydown = e => {
  if (e.key === "Enter" && current && current.suggestion) return choose(current.suggestion.label);
  const i = parseInt(e.key) - 1; if (labels[i]) choose(labels[i]);
};

// ---- review: change or remove labels already given
let mode = "label", rlabel = null;
$("m-label").onclick = () => setMode("label");
$("m-review").onclick = () => setMode("review");
function setMode(m) {
  mode = m;
  $("m-label").classList.toggle("active", m === "label"); $("m-review").classList.toggle("active", m === "review");
  document.querySelector("main").hidden = m === "review"; $("review").hidden = m !== "review";
  $("subject-filters").hidden = m !== "label";
  if (m === "review") loadReview(); else { queue = []; refill().then(show); }
}
document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => { if (mode === "review") { rlabel = null; loadReview(); } }));

async function loadReview() {
  const d = await (await fetch(`/api/crops?kind=${kind}&limit=1`)).json();
  const suggested = Object.keys(d.stats).filter(k => k.startsWith("review:"))
    .sort((a, b) => d.stats[a] - d.stats[b] || a.localeCompare(b));
  const manual = d.labels.filter(l => d.stats[l]);
  const names = suggested.concat(manual, Object.keys(d.stats).filter(k => k.startsWith("auto:") && !suggested.includes(`review:${k.slice(5)}`)).sort());
  if (!names.includes(rlabel)) rlabel = names[0] || null;
  $("rfilter").innerHTML = "";
  names.forEach(l => {
    const b = document.createElement("button");
    if (l.startsWith("review:")) b.textContent = `Da verificare · ${l.slice(7)} (${d.stats[l]})`;
    else if (l.startsWith("auto:")) b.textContent = `auto · ${l.slice(5)} (${d.stats[l]})`;
    else b.textContent = `${l} · corretti (${d.stats[l]})`;
    b.classList.toggle("active", l === rlabel);
    b.onclick = () => { rlabel = l; loadReview(); }; $("rfilter").appendChild(b);
  });
  $("rgrid").innerHTML = "";
  if (!rlabel) { $("rgrid").textContent = "Nessun ritaglio da rivedere."; return; }
  const r = await (await fetch(`/api/crops?kind=${kind}&label=${encodeURIComponent(rlabel)}&limit=100`)).json();
  r.crops.forEach(c => {
    const el = document.createElement("div"); el.className = "rc";
    const predicted = c.suggestion?.label || c.auto_label || c.pred_label || "";
    const confidence = c.suggestion?.score ?? c.auto_conf ?? c.pred_conf;
    const opts = d.labels.map(l => `<option value="${l}" ${l === (c.label || predicted) ? "selected" : ""}>${l}</option>`).join("");
    const when = new Date(c.created_at).toLocaleString("it-IT", {day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
    el.innerHTML = `<img loading="lazy" src="/crop/${c.id}" alt="Ritaglio ${c.det_class}"><div class="rcinfo">${c.camera.trim()} · ${when}${confidence != null ? ` · ${Math.round(confidence * 100)}%` : ""}</div><select aria-label="Correggi etichetta">${opts}<option value="__none">↩ Togli etichetta</option></select>`;
    el.querySelector("select").onchange = async e => {
      const v = e.target.value;
      const response = await fetch(`/api/crops/${c.id}/label`, { method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ label: v === "__none" ? null : v }) });
      if (response.ok) loadReview(); else e.target.value = c.label || predicted;
    };
    $("rgrid").appendChild(el);
  });
}


refill().then(show);
</script>
</body>
